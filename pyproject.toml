[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libra-lm"
version = "0.12.0"
description = "A GPT-style language model written from scratch on NumPy. No pretrained models, no API keys."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12"]

[project.scripts]
libra = "libra.cli:main"

[tool.setuptools]
packages = ["libra", "libra.webui"]

[tool.setuptools.package-data]
"libra.webui" = ["*.html", "*.js", "*.svg", "*.png", "*.webmanifest"]

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install opencv-python-headless || echo "OpenCV unavailable, so the QR decode check is skipped"
      - run: python -m unittest discover -s tests -v
      - run: ./.github/smoke.sh

  # Debian's own Python versions: 3.9 (Debian 11) and 3.11 (Debian 12). Runner images no longer ship 3.9.
  debian:
    name: test (Debian ${{ matrix.debian }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-${{ matrix.debian }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.9", debian: bullseye}
          - {python: "3.11", debian: bookworm}
    steps:
      - uses: actions/checkout@v5
      - run: pip install -e .
      - run: pip install opencv-python-headless || echo "OpenCV unavailable, so the QR decode check is skipped"
      - run: python -m unittest discover -s tests -v
      - run: ./.github/smoke.sh

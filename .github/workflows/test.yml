name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Smoke-train on sample data
        run: |
          libra train data --out ckpt --steps 40 --eval-every 20 --vocab 400 --ctx 32 --layers 1 --embd 32 --heads 2
          libra generate --model ckpt --prompt "The" --max-tokens 10

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Smoke-train on sample data
        run: |
          libra train data --out ckpt --steps 40 --eval-every 20 --vocab 400 --ctx 32 --layers 1 --embd 32 --heads 2
          libra generate --model ckpt --prompt "The" --max-tokens 10
          libra data data --out ds && libra train ds --out ckpt2 --steps 5 --eval-every 5 --vocab 400 --ctx 32 --layers 1 --embd 32 --heads 2
          libra skill list --plugins plugins
          libra skill run calc "(2+3)*4"
          export LIBRA_HOME=$PWD/libra-home
          libra mcp add fake -- python tests/fixtures/fake_mcp_server.py
          libra skill find echo
          libra skill run mcp.fake.echo hello
          libra trust list
          libra translate add examples/phrasebook_en_es.tsv --src en --tgt es
          libra translate align --src en --tgt es
          libra translate text "Where is the hotel?" --to es

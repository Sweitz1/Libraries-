name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install opencv-python-headless || echo "OpenCV unavailable, so the QR decode check is skipped"
      - run: python -m unittest discover -s tests -v
      - run: ./.github/smoke.sh

  # Debian's own Python versions: 3.9 (Debian 11) and 3.11 (Debian 12). Runner images no longer ship 3.9.
  debian:
    name: test (Debian ${{ matrix.debian }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-${{ matrix.debian }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.9", debian: bullseye}
          - {python: "3.11", debian: bookworm}
    steps:
      - uses: actions/checkout@v5
      # The container runs as root but the checkout belongs to the runner's user, so git refuses it
      # ("dubious ownership") unless it's marked safe. Tests that read git history need it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pip install -e .
      - run: pip install opencv-python-headless || echo "OpenCV unavailable, so the QR decode check is skipped"
      - run: python -m unittest discover -s tests -v
      - run: ./.github/smoke.sh

  # The Java client (clients/java), tested against a real `libra serve`.
  java-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: pip install -e .
      - name: Start a Libra server
        run: |
          export LIBRA_HOME="$RUNNER_TEMP/libra-home"
          nohup libra serve --host 127.0.0.1 --port 8791 --token ci-test-token > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8791/health && break; sleep 1; done
      - name: Build and test (including against the server)
        working-directory: clients/java
        env:
          LIBRA_TEST_URL: http://127.0.0.1:8791
          LIBRA_TEST_TOKEN: ci-test-token
        run: mvn -B verify
      - if: failure()
        run: cat "$RUNNER_TEMP/serve.log"

  # Security audit with Stingward (pinned): dependencies against OSV/CISA KEV/EPSS, secrets, code,
  # agent and MCP settings, and every Claude Code skill. Must stay free of high and critical findings.
  stingward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install stingward==0.1.11
      - name: Audit the project
        run: stingward . --lang en --no-color --fail-on high --markdown "$RUNNER_TEMP/stingward.md"
      - name: Audit every skill and the plugins
        run: |
          for d in .claude/skills/* templates/claude-skill plugins; do
            stingward skill "$d" --lang en --no-color --fail-on medium --offline || exit 1
          done
      - if: always()
        run: cat "$RUNNER_TEMP/stingward.md" >> "$GITHUB_STEP_SUMMARY" || true

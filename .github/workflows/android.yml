name: android

on:
  push:
    paths:
      - 'android/**'
      - 'libra/webui/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK; make sure platform 34 is there.
      - name: Android SDK 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Release key (optional; without it the APK is signed with a debug key)
        env:
          KEYSTORE_B64: ${{ secrets.LIBRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LIBRA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests, lint, build
        working-directory: android
        env:
          LIBRA_KEYSTORE_PASSWORD: ${{ secrets.LIBRA_KEYSTORE_PASSWORD }}
          LIBRA_KEY_ALIAS: ${{ secrets.LIBRA_KEY_ALIAS }}
          LIBRA_KEY_PASSWORD: ${{ secrets.LIBRA_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/libra.apk || true
          cp android/app/build/outputs/apk/debug/app-debug.apk out/libra-debug.apk || true
          cp android/app/build/reports/lint-results-debug.html out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libra-android
          path: out/
          retention-days: 30

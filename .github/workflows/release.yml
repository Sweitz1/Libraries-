name: release

# Pushing a tag like v0.16.0 builds everything and publishes a GitHub release with:
#   the Python packages (wheel and source), libra.apk, and SHA256SUMS.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:   # a dry run: builds the artifacts without publishing a release

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: The tag must match the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/release.sh --check
          test "v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" = "$GITHUB_REF_NAME"
      - run: pip install -e . build
      - run: python -m unittest discover -s tests
      - run: ./.github/smoke.sh
      - run: python -m build
      - name: The built wheel installs and runs on its own
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/libra eval plan --no-record
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Release key (optional; without it the APK is signed with a debug key)
        env:
          KEYSTORE_B64: ${{ secrets.LIBRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LIBRA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - working-directory: android
        env:
          LIBRA_KEYSTORE_PASSWORD: ${{ secrets.LIBRA_KEYSTORE_PASSWORD }}
          LIBRA_KEY_ALIAS: ${{ secrets.LIBRA_KEY_ALIAS }}
          LIBRA_KEY_PASSWORD: ${{ secrets.LIBRA_KEY_PASSWORD }}
        # assembleDebug also creates the debug key that release builds fall back to without a release key
        run: |
          [ -n "${LIBRA_KEYSTORE_PATH:-}" ] || echo "::warning::No release signing key (LIBRA_KEYSTORE_BASE64): this APK is signed with a temporary debug key and later APKs won't install over it."
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - run: mkdir out && cp android/app/build/outputs/apk/release/app-release.apk out/libra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/

  publish:
    needs: [python, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd artifacts && sha256sum ./* > SHA256SUMS && cat SHA256SUMS && cd ..
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: artifacts/
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running a tag's workflow (e.g. after adding the signing key) replaces the files.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "Libra ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi

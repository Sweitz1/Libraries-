name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste tokens, pairing links or QR codes** (anything with `#token=` or `libra://pair`).
        For security problems, use the private process in SECURITY.md instead of a public issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Model and training
        - Server or web app
        - Android app
        - Agent, jobs or skills
        - Web scraping or crawling
        - Translation
        - Files and grounded answers
        - Installer or deployment
        - Discord
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or taps, and any error text.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Libra version
      description: From `libra info`, or the commit.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: e.g. Debian 12, Python 3.11, CPU only. For the app, the phone and Android version.
